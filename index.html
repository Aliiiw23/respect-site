<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Respect - ريسبكت</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
</head>
<body>

    <div id="auth-container" class="auth-wrapper">
        <div class="auth-box">
            <h2>تسجيل الدخول لـ Respect</h2>
            <div id="login-form">
                <input type="email" id="login-email" placeholder="البريد الإلكتروني">
                <input type="password" id="login-password" placeholder="كلمة المرور">
                <button id="login-btn">دخول</button>
                <p>جديد هنا؟ <span id="show-signup">أنشئ حساباً</span></p>
            </div>
            <div id="signup-form" class="hidden">
                <input type="text" id="signup-username" placeholder="الاسم الظاهر">
                <input type="email" id="signup-email" placeholder="البريد الإلكتروني">
                <input type="password" id="signup-password" placeholder="كلمة المرور">
                <button id="signup-btn">إنشاء حساب</button>
                <p>لديك حساب؟ <span id="show-login">سجل دخولك</span></p>
            </div>
        </div>
    </div>

    <div id="app-container" class="main-wrapper hidden">
        <div class="sidebar">
            <div class="logo"><h2>Respect</h2></div>
            <div class="sidebar-menu">
                <a href="#" class="active"><i class="fas fa-home"></i> <span>الرئيسية</span></a>
                <a href="#"><i class="fas fa-hashtag"></i> <span>اكتشف</span></a>
                <a href="#"><i class="fas fa-user"></i> <span id="current-user-name">أنا</span></a>
                <a href="#" id="logout-btn" style="color: red;"><i class="fas fa-sign-out-alt"></i> <span>خروج</span></a>
            </div>
        </div>

        <div class="feed">
            <div class="feed-header"><h3>الرئيسية</h3></div>
            
            <div class="tweet-box">
                <div class="input-group">
                    <i class="fas fa-user-circle" style="font-size: 30px; color: #ccc; margin-left:10px;"></i>
                    <input type="text" id="tweetInput" placeholder="ماذا يحدث؟">
                </div>
                <div class="tweet-actions">
                    <div class="icons">
                        <label for="imageInput"><i class="far fa-image"></i></label>
                        <input type="file" id="imageInput" accept="image/*" style="display: none;">
                        <span id="fileName" style="font-size: 12px; color: #1d9bf0;"></span>
                    </div>
                    <button id="tweetBtn" class="tweet-btn">نشر</button>
                </div>
                <div id="uploadProgressBar" style="width: 0%; height: 3px; background: #1d9bf0; margin-top:5px;"></div>
            </div>

            <div id="feedContainer"></div>
        </div>

        <div class="widgets">
            <div class="trends-container">
                <h3>المتداول في Respect</h3>
                <p>#برمجة_العراق</p>
                <p>#Netlify</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
