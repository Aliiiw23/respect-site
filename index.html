<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Respect - المنصة العالمية</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
</head>
<body>

    <div id="loader"><div class="spinner"></div></div>

    <div id="auth-screen" class="hidden">
        <div class="auth-box">
            <h1 class="brand-logo-large">Respect</h1>
            <p>سجل دخولك الآن</p>
            <div id="login-form">
                <input type="email" id="login-email" placeholder="البريد الإلكتروني">
                <input type="password" id="login-password" placeholder="كلمة المرور">
                <button onclick="login()">دخول</button>
                <p class="switch-msg">جديد؟ <span onclick="showSignup()">أنشئ حساباً</span></p>
            </div>
            <div id="signup-form" class="hidden">
                <input type="text" id="signup-name" placeholder="الاسم الظاهر">
                <input type="email" id="signup-email" placeholder="البريد الإلكتروني">
                <input type="password" id="signup-password" placeholder="كلمة المرور">
                <button onclick="signup()">إنشاء حساب</button>
                <p class="switch-msg">لديك حساب؟ <span onclick="showLogin()">دخول</span></p>
            </div>
        </div>
    </div>

    <div id="app-screen" class="hidden">
        <header>
            <div class="header-content">
                <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" id="header-avatar" onclick="openProfileModal()">
                <h1 class="brand-logo">Respect</h1>
                <i class="fas fa-cog config-icon"></i>
            </div>
        </header>

        <div class="main-container">
            <div class="tweet-box-area">
                <div class="input-row">
                    <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" id="input-avatar" class="avatar-small">
                    <textarea id="tweet-text" placeholder="ما الذي يحدث؟"></textarea>
                </div>
                <div class="actions-row">
                    <div class="attach-icon">
                        <label for="file-input"><i class="far fa-image"></i></label>
                        <input type="file" id="file-input" hidden accept="image/*">
                        <span id="file-status"></span>
                    </div>
                    <button onclick="addPost()" id="post-btn">نشر</button>
                </div>
                <div id="upload-bar"></div>
            </div>

            <div id="posts-container">
                </div>
        </div>
    </div>

    <div id="profile-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('profile-modal')">&times;</span>
            <h3>تعديل الملف الشخصي</h3>
            <div class="profile-header">
                <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" id="edit-avatar-preview">
                <label for="new-avatar-input" class="edit-avatar-btn">تغيير الصورة</label>
                <input type="file" id="new-avatar-input" hidden accept="image/*">
            </div>
            <input type="text" id="edit-name" placeholder="الاسم">
            <textarea id="edit-bio" placeholder="نبذة تعريفية (Bio)"></textarea>
            <button onclick="saveProfile()" class="save-btn">حفظ التغييرات</button>
            <button onclick="logout()" class="logout-btn">تسجيل خروج</button>
        </div>
    </div>

    <div id="comment-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('comment-modal')">&times;</span>
            <h3>الردود</h3>
            <div id="comments-list"></div>
            <div class="comment-input-area">
                <input type="text" id="comment-text" placeholder="غرد ردك...">
                <button onclick="sendComment()">رد</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
